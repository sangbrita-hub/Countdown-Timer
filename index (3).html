<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Design Tokens ──────────────────────────────── */
    :root {
      --bg:          #F5F2ED;
      --surface:     #FFFFFF;
      --surface-2:   #F0EDE8;
      --border:      #E2DDD6;
      --accent:      #2A2118;
      --accent-warm: #C4622D;
      --accent-soft: #E8D5C4;
      --text-primary:#1A1410;
      --text-secondary:#7A6E64;
      --text-muted:  #B0A89E;
      --success:     #3A7D5E;
      --success-bg:  #E8F5EE;
      --danger:      #C4362D;
      --danger-bg:   #FDECEA;
      --warn:        #C47B2D;
      --warn-bg:     #FDF3E8;
      --radius-sm:   6px;
      --radius:      12px;
      --radius-lg:   20px;
      --shadow-sm:   0 1px 3px rgba(42,33,24,.06), 0 1px 2px rgba(42,33,24,.04);
      --shadow:      0 4px 16px rgba(42,33,24,.08), 0 1px 4px rgba(42,33,24,.06);
      --shadow-lg:   0 20px 48px rgba(42,33,24,.14), 0 4px 12px rgba(42,33,24,.08);
      --transition:  .2s cubic-bezier(.4,0,.2,1);
    }

    /* ── Reset ──────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Page Shell ─────────────────────────────────── */
    .page-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 clamp(16px,4vw,48px);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      gap: 16px;
    }
    .logo {
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-shrink: 0;
    }
    .logo-mark {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--accent);
      letter-spacing: -.5px;
    }
    .logo-sub {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent-warm);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: clamp(24px,4vw,48px) clamp(16px,4vw,48px);
    }

    /* ── Buttons ─────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      border-radius: var(--radius-sm);
      transition: var(--transition);
      white-space: nowrap;
      outline: none;
    }
    .btn:focus-visible { box-shadow: 0 0 0 3px rgba(196,98,45,.3); }

    .btn-primary {
      background: var(--accent);
      color: #FFF;
      padding: 10px 20px;
      font-size: 14px;
    }
    .btn-primary:hover { background: #3D2F22; transform: translateY(-1px); box-shadow: var(--shadow); }
    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
      background: var(--surface);
      color: var(--text-primary);
      padding: 10px 20px;
      font-size: 14px;
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface-2); border-color: var(--text-muted); }

    .btn-accent {
      background: var(--accent-warm);
      color: #FFF;
      padding: 10px 20px;
      font-size: 14px;
    }
    .btn-accent:hover { background: #A8501F; transform: translateY(-1px); box-shadow: var(--shadow); }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger);
      padding: 7px 14px;
      font-size: 13px;
    }
    .btn-danger:hover { background: var(--danger); color: #FFF; }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      padding: 7px 14px;
      font-size: 13px;
    }
    .btn-ghost:hover { background: var(--surface-2); color: var(--text-primary); }

    .btn-icon {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text-secondary);
      font-size: 15px;
    }
    .btn-icon:hover { background: var(--surface-2); color: var(--text-primary); }
    .btn-icon.danger:hover { background: var(--danger-bg); color: var(--danger); }
    .btn-icon.success:hover { background: var(--success-bg); color: var(--success); }

    .btn-sm { padding: 6px 12px; font-size: 12px; }

    /* ── Toolbar ─────────────────────────────────────── */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 28px;
    }
    .search-wrap {
      position: relative;
      flex: 1;
      min-width: 180px;
      max-width: 320px;
    }
    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
      pointer-events: none;
    }
    .search-input {
      width: 100%;
      padding: 9px 12px 9px 36px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
    }
    .search-input:focus { border-color: var(--accent-warm); box-shadow: 0 0 0 3px rgba(196,98,45,.12); }
    .search-input::placeholder { color: var(--text-muted); }

    .filter-group {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .filter-btn {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      border-right: 1px solid var(--border);
    }
    .filter-btn:last-child { border-right: none; }
    .filter-btn:hover { background: var(--surface-2); color: var(--text-primary); }
    .filter-btn.active { background: var(--accent); color: #FFF; }

    .sort-select {
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      color: var(--text-secondary);
      outline: none;
      cursor: pointer;
      transition: var(--transition);
    }
    .sort-select:focus { border-color: var(--accent-warm); box-shadow: 0 0 0 3px rgba(196,98,45,.12); }

    /* ── Timer Grid ──────────────────────────────────── */
    .timers-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }

    /* ── Empty State ─────────────────────────────────── */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      animation: fadeUp .4s ease both;
    }
    .empty-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .empty-state h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--text-primary);
      margin-bottom: 8px;
    }
    .empty-state p { color: var(--text-secondary); font-size: 15px; margin-bottom: 24px; }

    /* ── Timer Card ──────────────────────────────────── */
    .timer-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      animation: fadeUp .35s ease both;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      overflow: hidden;
    }
    .timer-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: var(--accent-warm);
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
      transform: scaleX(0);
      transform-origin: left;
      transition: transform .4s ease;
    }
    .timer-card:hover { box-shadow: var(--shadow); transform: translateY(-2px); }
    .timer-card:hover::before { transform: scaleX(1); }
    .timer-card.completed { border-color: var(--success); background: var(--success-bg); }
    .timer-card.completed::before { background: var(--success); transform: scaleX(1); }
    .timer-card.paused { opacity: .8; }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }
    .card-title {
      font-family: 'DM Serif Display', serif;
      font-size: 18px;
      color: var(--text-primary);
      line-height: 1.3;
      word-break: break-word;
    }
    .card-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    /* ── Countdown Display ───────────────────────────── */
    .countdown-display {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      text-align: center;
    }
    .time-unit {
      background: var(--bg);
      border-radius: var(--radius-sm);
      padding: 10px 4px;
      transition: background var(--transition);
    }
    .timer-card.completed .time-unit { background: rgba(58,125,94,.12); }
    .time-value {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 26px;
      font-weight: 500;
      color: var(--text-primary);
      line-height: 1;
      letter-spacing: -1px;
      transition: transform .15s ease;
    }
    .time-value.tick { transform: scale(1.08); }
    .time-label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ── Status Badge ────────────────────────────────── */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .5px;
      text-transform: uppercase;
    }
    .status-badge.active   { background: var(--warn-bg); color: var(--warn); }
    .status-badge.paused   { background: var(--surface-2); color: var(--text-secondary); }
    .status-badge.completed { background: var(--success-bg); color: var(--success); }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .status-badge.active .status-dot {
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* ── Card Meta ───────────────────────────────────── */
    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .card-date {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'DM Mono', monospace;
    }

    .card-controls {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    /* ── Times Up ────────────────────────────────────── */
    .times-up {
      text-align: center;
      padding: 12px;
      background: var(--success-bg);
      border-radius: var(--radius-sm);
    }
    .times-up-text {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: var(--success);
    }

    /* ── Add Timer Button (Fab) ──────────────────────── */
    .fab {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--accent-warm);
      color: #FFF;
      border: none;
      font-size: 24px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-lg);
      transition: var(--transition);
      z-index: 200;
    }
    .fab:hover { background: #A8501F; transform: scale(1.08); }
    .fab:active { transform: scale(.96); }

    /* ── Modal ───────────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,20,16,.45);
      backdrop-filter: blur(4px);
      z-index: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .modal-overlay.open { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 480px;
      box-shadow: var(--shadow-lg);
      transform: scale(.95) translateY(10px);
      transition: transform .25s cubic-bezier(.34,1.56,.64,1);
      overflow: hidden;
    }
    .modal-overlay.open .modal { transform: scale(1) translateY(0); }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 24px 0;
    }
    .modal-title {
      font-family: 'DM Serif Display', serif;
      font-size: 22px;
      color: var(--text-primary);
    }
    .modal-close {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: none;
      font-size: 18px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
    }
    .modal-close:hover { background: var(--surface-2); color: var(--text-primary); }
    .modal-body { padding: 24px; }
    .modal-footer {
      padding: 0 24px 24px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    /* ── Form ────────────────────────────────────────── */
    .form-group { margin-bottom: 18px; }
    .form-group:last-child { margin-bottom: 0; }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      letter-spacing: .3px;
    }
    input[type="text"],
    input[type="date"],
    input[type="time"] {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      transition: var(--transition);
    }
    input:focus {
      border-color: var(--accent-warm);
      box-shadow: 0 0 0 3px rgba(196,98,45,.12);
    }
    input::placeholder { color: var(--text-muted); }
    .field-error {
      margin-top: 5px;
      font-size: 12px;
      color: var(--danger);
      display: none;
    }
    .field-error.show { display: block; }
    input.error { border-color: var(--danger); }
    input.error:focus { box-shadow: 0 0 0 3px rgba(196,54,45,.12); }

    /* ── Confirm Dialog ──────────────────────────────── */
    .confirm-overlay {
      position: fixed;
      inset: 0;
      background: rgba(26,20,16,.5);
      backdrop-filter: blur(4px);
      z-index: 400;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .confirm-overlay.open { opacity: 1; pointer-events: all; }
    .confirm-box {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 32px;
      max-width: 360px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      text-align: center;
      transform: scale(.95);
      transition: transform .2s cubic-bezier(.34,1.56,.64,1);
    }
    .confirm-overlay.open .confirm-box { transform: scale(1); }
    .confirm-icon {
      width: 52px;
      height: 52px;
      background: var(--danger-bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-size: 22px;
    }
    .confirm-box h3 {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .confirm-box p { color: var(--text-secondary); font-size: 14px; margin-bottom: 24px; }
    .confirm-actions { display: flex; gap: 10px; justify-content: center; }

    /* ── Animations ──────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: .4; }
    }
    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }

    /* ── Toast Notification ──────────────────────────── */
    .toast-container {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 500;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--accent);
      color: #FFF;
      padding: 12px 20px;
      border-radius: var(--radius);
      font-size: 14px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: toastIn .3s ease both;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.success { background: var(--success); }
    .toast.error   { background: var(--danger); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
      to { opacity: 0; transform: translateY(8px) scale(.96); }
    }

    /* ── Responsive ──────────────────────────────────── */
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
      .timers-grid { grid-template-columns: 1fr; }
      .fab { bottom: 20px; right: 20px; }
      .header-inner { flex-wrap: wrap; height: auto; padding: 12px 0; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .search-wrap { max-width: 100%; }
    }

    /* ── Count indicator ─────────────────────────────── */
    .timers-count {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .timers-count strong { color: var(--text-secondary); }
  </style>
</head>
<body>

<!-- ── Header ────────────────────────────────────── -->
<header class="page-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-mark">Timr</span>
      <span class="logo-sub">Countdown</span>
    </div>
    <div class="header-actions">
      <button class="btn btn-accent" id="openAddModal" aria-label="Add new timer">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2"><line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/></svg>
        New Timer
      </button>
    </div>
  </div>
</header>

<!-- ── Main Content ───────────────────────────────── -->
<main>
  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="14" y2="14"/>
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search timers..." aria-label="Search timers" />
    </div>
    <div class="filter-group" role="group" aria-label="Filter timers">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="active">Active</button>
      <button class="filter-btn" data-filter="completed">Completed</button>
    </div>
    <select class="sort-select" id="sortSelect" aria-label="Sort timers">
      <option value="created">Latest Created</option>
      <option value="closest">Closest Ending</option>
    </select>
  </div>

  <!-- Count -->
  <div class="timers-count" id="timersCount"></div>

  <!-- Timer Grid -->
  <div class="timers-grid" id="timersGrid" role="list" aria-label="Timers"></div>
</main>

<!-- ── FAB ───────────────────────────────────────── -->
<button class="fab" id="fabAdd" aria-label="Add new timer" title="Add Timer">
  <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2">
    <line x1="11" y1="2" x2="11" y2="20"/><line x1="2" y1="11" x2="20" y2="11"/>
  </svg>
</button>

<!-- ── Add/Edit Modal ─────────────────────────────── -->
<div class="modal-overlay" id="timerModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title" id="modalTitle">New Timer</h2>
      <button class="modal-close" id="closeModal" aria-label="Close modal">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="timerTitle">Timer Title</label>
        <input type="text" id="timerTitle" placeholder="e.g. Project Deadline" maxlength="60" autocomplete="off" />
        <div class="field-error" id="titleError">Please enter a title for your timer.</div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="timerDate">Target Date</label>
          <input type="date" id="timerDate" />
          <div class="field-error" id="dateError">Please choose a valid date.</div>
        </div>
        <div class="form-group">
          <label for="timerTime">Target Time</label>
          <input type="time" id="timerTime" />
          <div class="field-error" id="timeError">Please choose a valid time.</div>
        </div>
      </div>
      <div class="field-error" id="pastError" style="font-size:13px;">The selected date and time is in the past. Please choose a future date/time.</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveTimer">Save Timer</button>
    </div>
  </div>
</div>

<!-- ── Confirm Delete Dialog ──────────────────────── -->
<div class="confirm-overlay" id="confirmOverlay" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="confirm-box">
    <div class="confirm-icon">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="#C4362D" stroke-width="2">
        <polyline points="3 6 5 6 19 6"/><path d="M8 6V4h6v2"/><path d="M19 6l-1 13H4L3 6"/>
        <line x1="9" y1="10" x2="9" y2="16"/><line x1="13" y1="10" x2="13" y2="16"/>
      </svg>
    </div>
    <h3 id="confirmTitle">Delete Timer?</h3>
    <p>This timer will be permanently removed. This action cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn btn-secondary" id="cancelDelete">Keep It</button>
      <button class="btn btn-danger" id="confirmDelete">Delete</button>
    </div>
  </div>
</div>

<!-- ── Toast Container ────────────────────────────── -->
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<!-- ── JavaScript ─────────────────────────────────── -->
<script>
/* ─────────────────────────────────────────────────
   STATE
───────────────────────────────────────────────── */
let timers = [];               // array of timer objects
let intervals = {};            // { [id]: intervalId }
let editingId = null;          // id of timer being edited
let deleteTargetId = null;     // id of timer to delete
let currentFilter = 'all';
let currentSort = 'created';
let searchQuery = '';

/* ─────────────────────────────────────────────────
   LOCAL STORAGE
───────────────────────────────────────────────── */
function saveToStorage() {
  localStorage.setItem('timr_timers', JSON.stringify(timers));
}
function loadFromStorage() {
  try {
    const raw = localStorage.getItem('timr_timers');
    timers = raw ? JSON.parse(raw) : [];
  } catch {
    timers = [];
  }
}

/* ─────────────────────────────────────────────────
   TIMER DATA HELPERS
───────────────────────────────────────────────── */
function createTimer(title, date, time) {
  return {
    id: `t_${Date.now()}_${Math.random().toString(36).slice(2,7)}`,
    title: title.trim(),
    targetDate: date,
    targetTime: time,
    createdAt: Date.now(),
    paused: false,
    completed: false,
    pausedAt: null,
    pausedRemaining: null // ms remaining when paused
  };
}

function getTargetMs(timer) {
  return new Date(`${timer.targetDate}T${timer.targetTime}`).getTime();
}

function getRemaining(timer) {
  if (timer.completed) return 0;
  if (timer.paused && timer.pausedRemaining !== null) return timer.pausedRemaining;
  return Math.max(0, getTargetMs(timer) - Date.now());
}

function msToParts(ms) {
  const total = Math.floor(ms / 1000);
  const s = total % 60;
  const m = Math.floor(total / 60) % 60;
  const h = Math.floor(total / 3600) % 24;
  const d = Math.floor(total / 86400);
  return { d, h, m, s };
}

function pad(n) { return String(n).padStart(2, '0'); }

/* ─────────────────────────────────────────────────
   RENDER
───────────────────────────────────────────────── */
function getFilteredSorted() {
  let list = timers.slice();

  // Search
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(t => t.title.toLowerCase().includes(q));
  }

  // Filter
  if (currentFilter === 'active')    list = list.filter(t => !t.completed);
  if (currentFilter === 'completed') list = list.filter(t => t.completed);

  // Sort
  if (currentSort === 'closest') {
    list.sort((a, b) => getTargetMs(a) - getTargetMs(b));
  } else {
    list.sort((a, b) => b.createdAt - a.createdAt);
  }

  return list;
}

function renderAll() {
  const grid = document.getElementById('timersGrid');
  const list = getFilteredSorted();

  // Stop old intervals for cards no longer shown
  const shownIds = new Set(list.map(t => t.id));
  Object.keys(intervals).forEach(id => {
    if (!shownIds.has(id)) {
      clearInterval(intervals[id]);
      delete intervals[id];
    }
  });

  if (list.length === 0) {
    grid.innerHTML = renderEmptyState();
    updateCount(0);
    return;
  }

  updateCount(list.length);

  // Diff: only update cards that changed
  const existing = {};
  grid.querySelectorAll('.timer-card').forEach(el => {
    existing[el.dataset.id] = el;
  });

  // Build ordered list of ids
  const newOrder = list.map(t => t.id);
  const oldOrder = Object.keys(existing);

  // If order or count changed, re-render all cards
  const needsRebuild = newOrder.join(',') !== oldOrder.join(',');

  if (needsRebuild) {
    grid.innerHTML = '';
    list.forEach(timer => {
      const el = buildCard(timer);
      grid.appendChild(el);
      startInterval(timer);
    });
  } else {
    list.forEach(timer => {
      updateCardCountdown(timer);
    });
  }
}

function renderEmptyState() {
  const msgs = {
    all:       ['No timers yet', 'Click "New Timer" to get started.'],
    active:    ['No active timers', 'All your timers have finished or none exist.'],
    completed: ['No completed timers', 'Active timers will appear here once they finish.']
  };
  const [h, p] = msgs[currentFilter] || msgs.all;
  return `
    <div class="empty-state" role="status">
      <div class="empty-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="#B0A89E" stroke-width="1.8">
          <circle cx="14" cy="14" r="11"/>
          <line x1="14" y1="8" x2="14" y2="14"/>
          <line x1="14" y1="14" x2="18" y2="17"/>
        </svg>
      </div>
      <h3>${h}</h3>
      <p>${p}</p>
      ${currentFilter === 'all' ? `<button class="btn btn-accent" onclick="openAddModal()">New Timer</button>` : ''}
    </div>`;
}

function updateCount(n) {
  const el = document.getElementById('timersCount');
  if (n === 0) { el.textContent = ''; return; }
  el.innerHTML = `Showing <strong>${n}</strong> timer${n !== 1 ? 's' : ''}`;
}

function buildCard(timer) {
  const el = document.createElement('div');
  el.className = 'timer-card' + (timer.completed ? ' completed' : '') + (timer.paused ? ' paused' : '');
  el.dataset.id = timer.id;
  el.setAttribute('role', 'listitem');
  el.innerHTML = cardHTML(timer);
  return el;
}

function cardHTML(timer) {
  const remaining = getRemaining(timer);
  const { d, h, m, s } = msToParts(remaining);
  const created = new Date(timer.createdAt).toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
  const target = new Date(`${timer.targetDate}T${timer.targetTime}`).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
  const status = timer.completed ? 'completed' : (timer.paused ? 'paused' : 'active');
  const statusLabel = timer.completed ? 'Completed' : (timer.paused ? 'Paused' : 'Active');

  const pauseIcon = timer.paused
    ? `<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><polygon points="2,1 12,7 2,13"/></svg>`
    : `<svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor"><rect x="2" y="1" width="4" height="12" rx="1"/><rect x="8" y="1" width="4" height="12" rx="1"/></svg>`;
  const pauseTitle = timer.paused ? 'Resume' : 'Pause';

  return `
    <div class="card-header">
      <div class="card-title">${escHtml(timer.title)}</div>
      <div class="card-actions">
        ${!timer.completed ? `
          <button class="btn btn-icon" title="Edit" aria-label="Edit timer" onclick="openEditModal('${timer.id}')">
            <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M10.5 2.5l2 2-7 7H3.5v-2l7-7z"/><line x1="9" y1="4" x2="11" y2="6"/>
            </svg>
          </button>` : ''}
        <button class="btn btn-icon danger" title="Delete" aria-label="Delete timer" onclick="confirmDeleteTimer('${timer.id}')">
          <svg width="15" height="15" viewBox="0 0 15 15" fill="none" stroke="currentColor" stroke-width="1.8">
            <polyline points="2 4 4 4 13 4"/><path d="M5.5 4V3h4v1"/><path d="M12 4l-1 9H4L3 4"/>
          </svg>
        </button>
      </div>
    </div>

    ${timer.completed
      ? `<div class="times-up"><div class="times-up-text">Time's Up!</div></div>`
      : `<div class="countdown-display" id="cd_${timer.id}">
          <div class="time-unit"><span class="time-value" id="d_${timer.id}">${pad(d)}</span><span class="time-label">Days</span></div>
          <div class="time-unit"><span class="time-value" id="h_${timer.id}">${pad(h)}</span><span class="time-label">Hours</span></div>
          <div class="time-unit"><span class="time-value" id="m_${timer.id}">${pad(m)}</span><span class="time-label">Mins</span></div>
          <div class="time-unit"><span class="time-value" id="s_${timer.id}">${pad(s)}</span><span class="time-label">Secs</span></div>
        </div>`
    }

    <div class="card-meta">
      <span class="status-badge ${status}"><span class="status-dot"></span>${statusLabel}</span>
      <span class="card-date" title="Target: ${target}">Created ${created}</span>
    </div>

    ${!timer.completed ? `
    <div class="card-controls">
      <button class="btn btn-ghost btn-sm" onclick="togglePause('${timer.id}')" aria-label="${pauseTitle}" title="${pauseTitle}">
        ${pauseIcon} ${pauseTitle}
      </button>
      <button class="btn btn-ghost btn-sm" onclick="resetTimer('${timer.id}')" aria-label="Reset timer" title="Reset">
        <svg width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M2 6.5A4.5 4.5 0 1 1 6.5 11"/><polyline points="2 4 2 7 5 7"/>
        </svg>
        Reset
      </button>
    </div>` : ''}
  `;
}

/* ─────────────────────────────────────────────────
   COUNTDOWN INTERVALS
───────────────────────────────────────────────── */
function startInterval(timer) {
  if (timer.completed) return;
  if (intervals[timer.id]) clearInterval(intervals[timer.id]);

  intervals[timer.id] = setInterval(() => tickTimer(timer.id), 1000);
}

function stopInterval(id) {
  if (intervals[id]) { clearInterval(intervals[id]); delete intervals[id]; }
}

function tickTimer(id) {
  const timer = timers.find(t => t.id === id);
  if (!timer || timer.paused) return;

  const remaining = getRemaining(timer);
  if (remaining <= 0) {
    timer.completed = true;
    timer.paused = false;
    stopInterval(id);
    saveToStorage();
    // Re-render the card
    const card = document.querySelector(`.timer-card[data-id="${id}"]`);
    if (card) {
      card.classList.add('completed');
      card.innerHTML = cardHTML(timer);
    }
    showToast(`"${timer.title}" has ended!`, 'success');
    return;
  }

  updateCardCountdown(timer);
}

function updateCardCountdown(timer) {
  if (timer.completed || timer.paused) return;
  const remaining = getRemaining(timer);
  const { d, h, m, s } = msToParts(remaining);

  const set = (id, val) => {
    const el = document.getElementById(id);
    if (!el) return;
    const newVal = pad(val);
    if (el.textContent !== newVal) {
      el.textContent = newVal;
      el.classList.add('tick');
      setTimeout(() => el.classList.remove('tick'), 150);
    }
  };

  set(`d_${timer.id}`, d);
  set(`h_${timer.id}`, h);
  set(`m_${timer.id}`, m);
  set(`s_${timer.id}`, s);
}

/* ─────────────────────────────────────────────────
   TIMER ACTIONS
───────────────────────────────────────────────── */
function togglePause(id) {
  const timer = timers.find(t => t.id === id);
  if (!timer || timer.completed) return;

  if (timer.paused) {
    // Resume — adjust target so remaining time is preserved
    const remaining = timer.pausedRemaining || 0;
    const newTarget = new Date(Date.now() + remaining);
    timer.targetDate = newTarget.toISOString().slice(0,10);
    timer.targetTime = newTarget.toTimeString().slice(0,5);
    timer.paused = false;
    timer.pausedRemaining = null;
    timer.pausedAt = null;
    startInterval(timer);
  } else {
    // Pause
    timer.pausedRemaining = getRemaining(timer);
    timer.pausedAt = Date.now();
    timer.paused = true;
    stopInterval(id);
  }

  saveToStorage();
  // Re-render card
  const card = document.querySelector(`.timer-card[data-id="${id}"]`);
  if (card) {
    card.className = 'timer-card' + (timer.paused ? ' paused' : '');
    card.innerHTML = cardHTML(timer);
  }
}

function resetTimer(id) {
  const timer = timers.find(t => t.id === id);
  if (!timer) return;

  // Reset to original target (re-open edit modal pre-filled for new date/time)
  // For reset: just unpause + re-render
  timer.paused = false;
  timer.pausedRemaining = null;
  timer.pausedAt = null;

  // If completed, let user know they need to edit the timer
  if (timer.completed) {
    showToast('Timer completed. Edit it to set a new date.', 'error');
    return;
  }

  saveToStorage();
  const card = document.querySelector(`.timer-card[data-id="${id}"]`);
  if (card) {
    card.className = 'timer-card';
    card.innerHTML = cardHTML(timer);
  }
  startInterval(timer);
  showToast('Timer resumed from current target.');
}

/* ─────────────────────────────────────────────────
   ADD / EDIT MODAL
───────────────────────────────────────────────── */
function openAddModal() {
  editingId = null;
  document.getElementById('modalTitle').textContent = 'New Timer';
  document.getElementById('timerTitle').value = '';
  document.getElementById('timerDate').value = '';
  document.getElementById('timerTime').value = '';
  clearFormErrors();
  openModal('timerModal');
}

function openEditModal(id) {
  const timer = timers.find(t => t.id === id);
  if (!timer) return;
  editingId = id;
  document.getElementById('modalTitle').textContent = 'Edit Timer';
  document.getElementById('timerTitle').value = timer.title;
  document.getElementById('timerDate').value = timer.targetDate;
  document.getElementById('timerTime').value = timer.targetTime;
  clearFormErrors();
  openModal('timerModal');
}

function openModal(id) {
  document.getElementById(id).classList.add('open');
  setTimeout(() => {
    const first = document.getElementById('timerTitle');
    if (first) first.focus();
  }, 100);
}

function closeModal() {
  document.getElementById('timerModal').classList.remove('open');
  editingId = null;
}

function clearFormErrors() {
  ['titleError','dateError','timeError','pastError'].forEach(id => {
    document.getElementById(id).classList.remove('show');
  });
  ['timerTitle','timerDate','timerTime'].forEach(id => {
    document.getElementById(id).classList.remove('error');
  });
}

function validateForm() {
  clearFormErrors();
  let valid = true;
  const title = document.getElementById('timerTitle').value.trim();
  const date  = document.getElementById('timerDate').value;
  const time  = document.getElementById('timerTime').value;

  if (!title) {
    document.getElementById('titleError').classList.add('show');
    document.getElementById('timerTitle').classList.add('error');
    valid = false;
  }
  if (!date) {
    document.getElementById('dateError').classList.add('show');
    document.getElementById('timerDate').classList.add('error');
    valid = false;
  }
  if (!time) {
    document.getElementById('timeError').classList.add('show');
    document.getElementById('timerTime').classList.add('error');
    valid = false;
  }
  if (valid) {
    const target = new Date(`${date}T${time}`).getTime();
    if (target <= Date.now()) {
      document.getElementById('pastError').classList.add('show');
      document.getElementById('timerDate').classList.add('error');
      document.getElementById('timerTime').classList.add('error');
      valid = false;
    }
  }
  return valid;
}

function saveTimer() {
  if (!validateForm()) return;

  const title = document.getElementById('timerTitle').value.trim();
  const date  = document.getElementById('timerDate').value;
  const time  = document.getElementById('timerTime').value;

  if (editingId) {
    // Edit
    const timer = timers.find(t => t.id === editingId);
    if (timer) {
      timer.title = title;
      timer.targetDate = date;
      timer.targetTime = time;
      timer.completed = false;
      timer.paused = false;
      timer.pausedRemaining = null;
      timer.pausedAt = null;
      stopInterval(editingId);
      startInterval(timer);
    }
    showToast('Timer updated.');
  } else {
    // Create
    const timer = createTimer(title, date, time);
    timers.unshift(timer);
    startInterval(timer);
    showToast('Timer created!', 'success');
  }

  saveToStorage();
  closeModal();
  renderAll();
}

/* ─────────────────────────────────────────────────
   DELETE
───────────────────────────────────────────────── */
function confirmDeleteTimer(id) {
  deleteTargetId = id;
  document.getElementById('confirmOverlay').classList.add('open');
}

function doDelete() {
  if (!deleteTargetId) return;
  stopInterval(deleteTargetId);
  const timer = timers.find(t => t.id === deleteTargetId);
  timers = timers.filter(t => t.id !== deleteTargetId);
  deleteTargetId = null;
  document.getElementById('confirmOverlay').classList.remove('open');
  saveToStorage();
  renderAll();
  if (timer) showToast(`"${timer.title}" deleted.`);
}

/* ─────────────────────────────────────────────────
   TOAST
───────────────────────────────────────────────── */
function showToast(msg, type = '') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.animation = 'toastOut .3s ease forwards';
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

/* ─────────────────────────────────────────────────
   UTILITY
───────────────────────────────────────────────── */
function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* ─────────────────────────────────────────────────
   EVENTS
───────────────────────────────────────────────── */
document.getElementById('openAddModal').addEventListener('click', openAddModal);
document.getElementById('fabAdd').addEventListener('click', openAddModal);
document.getElementById('closeModal').addEventListener('click', closeModal);
document.getElementById('cancelModal').addEventListener('click', closeModal);
document.getElementById('saveTimer').addEventListener('click', saveTimer);
document.getElementById('cancelDelete').addEventListener('click', () => {
  deleteTargetId = null;
  document.getElementById('confirmOverlay').classList.remove('open');
});
document.getElementById('confirmDelete').addEventListener('click', doDelete);

// Filter buttons
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderAll();
  });
});

// Sort
document.getElementById('sortSelect').addEventListener('change', e => {
  currentSort = e.target.value;
  renderAll();
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderAll();
});

// Close modal on backdrop click
document.getElementById('timerModal').addEventListener('click', e => {
  if (e.target === document.getElementById('timerModal')) closeModal();
});
document.getElementById('confirmOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('confirmOverlay')) {
    deleteTargetId = null;
    document.getElementById('confirmOverlay').classList.remove('open');
  }
});

// Keyboard: Escape closes modals
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal();
    deleteTargetId = null;
    document.getElementById('confirmOverlay').classList.remove('open');
  }
  if (e.key === 'Enter' && document.getElementById('timerModal').classList.contains('open')) {
    saveTimer();
  }
});

/* ─────────────────────────────────────────────────
   BOOT
───────────────────────────────────────────────── */
loadFromStorage();

// Restore intervals for active timers
timers.forEach(timer => {
  if (!timer.completed && !timer.paused) startInterval(timer);
});

renderAll();
</script>
</body>
</html>
